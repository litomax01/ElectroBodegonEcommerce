<aside class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 sticky top-20">

  <!-- Header -->
  <div class="flex items-center justify-between mb-5">
    <h2 class="font-montserrat font-black text-[#111827] text-lg flex items-center gap-2">
      <i class="fas fa-sliders text-[#E60000]"></i> Filtros
    </h2>
    @if (hasActiveFilters()) {
      <button
        (click)="clearFilters()"
        class="text-xs font-montserrat font-semibold text-[#E60000] hover:text-red-700 flex items-center gap-1 transition-colors">
        <i class="fas fa-times-circle text-xs"></i> Limpiar
      </button>
    }
  </div>

  <!-- Results count -->
  <div class="bg-red-50 rounded-xl p-3 mb-5 flex items-center gap-2">
    <i class="fas fa-box text-[#E60000]"></i>
    <span class="text-sm font-montserrat font-semibold text-[#111827]">
      <strong class="text-[#E60000]">{{ totalResultados }}</strong>
      producto{{ totalResultados !== 1 ? 's' : '' }} encontrado{{ totalResultados !== 1 ? 's' : '' }}
    </span>
  </div>

  <div class="border-t border-gray-100 my-4"></div>

  <!-- Category Filter -->
  <div class="mb-6">
    <h3 class="font-montserrat font-bold text-[#111827] text-sm uppercase tracking-widest mb-3 flex items-center gap-2">
      <i class="fas fa-layer-group text-[#E60000] text-xs"></i> Categoría
    </h3>
    <ul class="space-y-2">
      @for (cat of categorias; track cat) {
        <li>
          <label class="flex items-center gap-3 cursor-pointer group">
            <input
              type="checkbox"
              [value]="cat"
              [checked]="selectedCategorias().includes(cat)"
              (change)="toggleCategoria(cat)"
              class="w-4 h-4 rounded cursor-pointer accent-[#E60000]"
            />
            <span class="text-sm font-inter text-gray-600 group-hover:text-[#E60000] transition-colors">
              {{ cat }}
            </span>
          </label>
        </li>
      }
    </ul>
  </div>

  <div class="border-t border-gray-100 my-4"></div>

  <!-- Brand Filter -->
  <div>
    <h3 class="font-montserrat font-bold text-[#111827] text-sm uppercase tracking-widest mb-3 flex items-center gap-2">
      <i class="fas fa-tag text-[#E60000] text-xs"></i> Marca
    </h3>
    <ul class="space-y-2">
      @for (marca of marcas; track marca) {
        <li>
          <label class="flex items-center gap-3 cursor-pointer group">
            <input
              type="checkbox"
              [value]="marca"
              [checked]="selectedMarcas().includes(marca)"
              (change)="toggleMarca(marca)"
              class="w-4 h-4 rounded cursor-pointer accent-[#E60000]"
            />
            <span class="text-sm font-inter text-gray-600 group-hover:text-[#E60000] transition-colors">
              {{ marca }}
            </span>
          </label>
        </li>
      }
    </ul>
  </div>
</aside>
